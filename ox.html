<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_BASE_URL =
    "https://oxfighterjets.onrender.com";

const API_PREFIX =
    `${API_BASE_URL}/api/ox`;


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentPlayer = null;
let currentGame = null;
let pollingTimer = null;
let matchmakingTimer = null;


/* =========================================================
   DOM HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   LOADING
========================================================= */

function showLoading(text="Please wait..."){

    $("loadingText").textContent = text;

    $("loading").classList.remove("hidden");
}


function hideLoading(){

    $("loading").classList.add("hidden");
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message,type="success"){

    const toast = $("toast");

    toast.textContent = message;

    toast.className =
        "toast " +
        (type === "error" ? "error" : "success");

    setTimeout(()=>{
        toast.classList.add("hidden");
    },3500);
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    options={}
){

    const token =
        localStorage.getItem("oxToken");

    const headers = {
        "Content-Type":"application/json",
        ...(options.headers || {})
    };

    if(token){
        headers["Authorization"] =
            `Bearer ${token}`;
    }

    try{

        const response =
            await fetch(
                `${API_PREFIX}${endpoint}`,
                {
                    ...options,
                    headers
                }
            );

        let data = {};

        try{
            data = await response.json();
        }catch{
            data = {};
        }

        if(response.status === 401){

            if(
                endpoint !== "/auth/login" &&
                endpoint !== "/auth/signup"
            ){

                localStorage.removeItem("oxToken");
                currentPlayer = null;

                showAuthScreen();

            }
        }

        if(!response.ok){

            throw new Error(
                data.message ||
                `Request failed (${response.status})`
            );
        }

        return data;

    }catch(error){

        console.error(
            "OX API Error:",
            endpoint,
            error
        );

        throw error;
    }
}


/* =========================================================
   AUTH TABS
========================================================= */

function showAuth(type){

    const login =
        type === "login";

    $("loginForm")
        .classList.toggle(
            "hidden",
            !login
        );

    $("signupForm")
        .classList.toggle(
            "hidden",
            login
        );

    $("loginTab")
        .classList.toggle(
            "active",
            login
        );

    $("signupTab")
        .classList.toggle(
            "active",
            !login
        );

    $("authMessage").textContent = "";
}


/* =========================================================
   AUTH SCREEN
========================================================= */

function showAuthScreen(){

    $("authScreen")
        .classList.remove("hidden");

    $("appScreen")
        .classList.add("hidden");

    $("mainHeader")
        .classList.add("hidden");

    $("gameCard")
        .classList.add("hidden");

    $("matchCard")
        .classList.add("hidden");

    stopGamePolling();
    stopMatchmakingPolling();
}


/* =========================================================
   APP SCREEN
========================================================= */

function showAppScreen(){

    $("authScreen")
        .classList.add("hidden");

    $("appScreen")
        .classList.remove("hidden");

    $("mainHeader")
        .classList.remove("hidden");
}


/* =========================================================
   SIGNUP
========================================================= */

async function signup(event){

    event.preventDefault();

    const name =
        $("signupName")
        .value
        .trim();

    const username =
        $("signupUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        $("signupPassword")
        .value;

    const confirmPassword =
        $("signupConfirmPassword")
        .value;


    if(!name){

        setAuthMessage(
            "Please enter your name.",
            true
        );

        return;
    }


    if(!username){

        setAuthMessage(
            "Please enter a username.",
            true
        );

        return;
    }


    if(!/^[a-zA-Z0-9_-]{3,30}$/.test(username)){

        setAuthMessage(
            "Username must be 3-30 characters and use only letters, numbers, _ or -.",
            true
        );

        return;
    }


    if(password.length < 6){

        setAuthMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    if(password !== confirmPassword){

        setAuthMessage(
            "Passwords do not match.",
            true
        );

        return;
    }


    try{

        showLoading(
            "Creating your account..."
        );

        const data =
            await apiRequest(
                "/auth/signup",
                {
                    method:"POST",
                    body:JSON.stringify({
                        name,
                        username,
                        password
                    })
                }
            );


        localStorage.setItem(
            "oxToken",
            data.token
        );


        currentPlayer =
            data.player;


        hideLoading();

        showToast(
            "Account created successfully!"
        );


        openDashboard();

    }catch(error){

        hideLoading();

        setAuthMessage(
            error.message,
            true
        );
    }
}


/* =========================================================
   LOGIN
========================================================= */

async function login(event){

    event.preventDefault();

    const username =
        $("loginUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        $("loginPassword")
        .value;


    if(!username || !password){

        setAuthMessage(
            "Username and password are required.",
            true
        );

        return;
    }


    try{

        showLoading(
            "Logging in..."
        );

        const data =
            await apiRequest(
                "/auth/login",
                {
                    method:"POST",
                    body:JSON.stringify({
                        username,
                        password
                    })
                }
            );


        localStorage.setItem(
            "oxToken",
            data.token
        );


        currentPlayer =
            data.player;


        hideLoading();

        showToast(
            "Login successful!"
        );


        openDashboard();

    }catch(error){

        hideLoading();

        setAuthMessage(
            error.message,
            true
        );
    }
}


/* =========================================================
   AUTH MESSAGE
========================================================= */

function setAuthMessage(
    message,
    isError=false
){

    const el =
        $("authMessage");

    el.textContent =
        message;

    el.className =
        "auth-message " +
        (isError ? "error" : "success");
}


/* =========================================================
   OPEN DASHBOARD
========================================================= */

function openDashboard(){

    showAppScreen();

    updateProfileUI();

    checkActiveGame();

    loadProfileSilently();
}


/* =========================================================
   PROFILE
========================================================= */

function updateProfileUI(){

    if(!currentPlayer){
        return;
    }

    $("welcomeName").textContent =
        currentPlayer.name;

    $("headerPlayer").textContent =
        `@${currentPlayer.username}`;

    $("profileId").textContent =
        currentPlayer.playerId;

    $("profileUsername").textContent =
        `Username: @${currentPlayer.username}`;

    $("statWins").textContent =
        currentPlayer.wins || 0;

    $("statLosses").textContent =
        currentPlayer.losses || 0;

    $("statDraws").textContent =
        currentPlayer.draws || 0;

    $("statWinRate").textContent =
        `${currentPlayer.winRate || 0}%`;
}


async function loadProfileSilently(){

    try{

        const data =
            await apiRequest(
                "/auth/me"
            );

        currentPlayer =
            data.player;

        updateProfileUI();

    }catch(error){

        console.error(
            "Profile error:",
            error
        );
    }
}


async function refreshProfile(){

    try{

        showLoading(
            "Refreshing profile..."
        );

        const data =
            await apiRequest(
                "/auth/me"
            );

        currentPlayer =
            data.player;

        updateProfileUI();

        hideLoading();

        showToast(
            "Profile refreshed."
        );

    }catch(error){

        hideLoading();

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

    try{

        await apiRequest(
            "/auth/logout",
            {
                method:"POST"
            }
        );

    }catch(error){

        console.error(error);

    }finally{

        localStorage.removeItem(
            "oxToken"
        );

        currentPlayer = null;

        showAuthScreen();

        showToast(
            "Logged out."
        );
    }
}


/* =========================================================
   RANDOM MATCH
========================================================= */

async function startRandomGame(){

    if(!currentPlayer){

        showAuthScreen();

        return;
    }


    try{

        $("matchCard")
            .classList.remove("hidden");

        $("matchStatus")
            .textContent =
            "Searching for an opponent...";


        const data =
            await apiRequest(
                "/matchmaking/join",
                {
                    method:"POST"
                }
            );


        if(data.matched && data.game){

            stopMatchmakingPolling();

            $("matchCard")
                .classList.add("hidden");

            openGame(
                data.game
            );

            return;
        }


        startMatchmakingPolling();

    }catch(error){

        $("matchCard")
            .classList.add("hidden");

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   MATCHMAKING POLLING
========================================================= */

function startMatchmakingPolling(){

    stopMatchmakingPolling();

    matchmakingTimer =
        setInterval(
            checkMatchmaking,
            2500
        );
}


function stopMatchmakingPolling(){

    if(matchmakingTimer){

        clearInterval(
            matchmakingTimer
        );

        matchmakingTimer = null;
    }
}


async function checkMatchmaking(){

    try{

        const data =
            await apiRequest(
                "/matchmaking/status"
            );


        if(data.game){

            stopMatchmakingPolling();

            $("matchCard")
                .classList.add("hidden");

            openGame(
                data.game
            );

            return;
        }


        if(data.waiting){

            $("matchStatus")
                .textContent =
                "Waiting for another player...";

        }else{

            $("matchStatus")
                .textContent =
                "Searching...";
        }

    }catch(error){

        stopMatchmakingPolling();

        $("matchCard")
            .classList.add("hidden");
    }
}


/* =========================================================
   CANCEL MATCHMAKING
========================================================= */

async function cancelMatchmaking(){

    stopMatchmakingPolling();

    try{

        await apiRequest(
            "/matchmaking/leave",
            {
                method:"POST"
            }
        );

        $("matchCard")
            .classList.add("hidden");

        showToast(
            "Matchmaking cancelled."
        );

    }catch(error){

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   OPEN GAME
========================================================= */

function openGame(game){

    currentGame = game;

    $("gameCard")
        .classList.remove("hidden");

    renderGame();

    startGamePolling();

    window.scrollTo({
        top:$("gameCard").offsetTop - 80,
        behavior:"smooth"
    });
}

/* =========================================================
   RENDER GAME — 10 x 10 BOARD
   WIN = 5 CONSECUTIVE X/O
========================================================= */

function renderGame(){

    if(!currentGame){
        return;
    }

    const board = $("board");

    board.innerHTML = "";

    const myPlayer =
        currentGame.players.find(
            p =>
                p.playerId === currentPlayer.playerId
        );


    /* =====================================================
       10 x 10 BOARD
    ===================================================== */

    for(let r = 0; r < 10; r++){

        for(let c = 0; c < 10; c++){

            const button =
                document.createElement("button");

            button.className = "cell";


            const value =
                currentGame.board[r]?.[c] || "";


            /* =================================================
               CELL VALUE
            ================================================= */

            if(value){

                button.textContent = value;

                button.classList.add(
                    value.toLowerCase()
                );
            }


            /* =================================================
               WINNING LINE
            ================================================= */

            if(
                currentGame.winningLine &&
                currentGame.winningLine.some(
                    cell =>
                        cell[0] === r &&
                        cell[1] === c
                )
            ){

                button.classList.add("win");
            }


            /* =================================================
               MOVE
            ================================================= */

            button.onclick =
                () => makeMove(r, c);


            /* =================================================
               DISABLE CONDITIONS
            ================================================= */

            if(
                currentGame.status !== "active" ||
                currentGame.currentTurn !==
                    currentPlayer.playerId ||
                value
            ){

                button.disabled = true;
            }


            board.appendChild(button);
        }
    }


    /* =====================================================
       TURN TEXT
    ===================================================== */

    const turnPlayer =
        currentGame.players.find(
            p =>
                p.playerId ===
                currentGame.currentTurn
        );


    if(
        currentGame.status === "active"
    ){

        if(
            currentGame.currentTurn ===
            currentPlayer.playerId
        ){

            $("turnText").textContent =
                `Your turn (${myPlayer?.symbol || ""})`;

        }else{

            $("turnText").textContent =
                `${turnPlayer?.name || "Opponent"}'s turn`;
        }

        $("gameResult").textContent = "";

    }else{

        showGameResult();
    }


    /* =====================================================
       REMATCH BUTTON
    ===================================================== */

    $("rematchBtn")
        .classList.toggle(
            "hidden",
            currentGame.status !== "finished"
        );
}

/* =========================================================
   GAME RESULT
========================================================= */

function showGameResult(){

    if(
        currentGame.result === "draw"
    ){

        $("turnText").textContent =
            "DRAW";

        $("gameResult").textContent =
            "Board is full.";

        return;
    }


    const winner =
        currentGame.players
        .find(
            p =>
            p.playerId ===
            currentGame.winner
        );


    if(
        currentGame.winner ===
        currentPlayer.playerId
    ){

        $("turnText").textContent =
            "🎉 YOU WON!";

        $("gameResult").textContent =
            "Congratulations!";

    }else{

        $("turnText").textContent =
            "GAME OVER";

        $("gameResult").textContent =
            `${winner?.name || "Opponent"} won.`;
    }
}


/* =========================================================
   MAKE MOVE
========================================================= */

async function makeMove(row,col){

    if(!currentGame){

        return;
    }


    if(
        currentGame.status !== "active"
    ){

        return;
    }


    if(
        currentGame.currentTurn !==
        currentPlayer.playerId
    ){

        showToast(
            "It is not your turn.",
            "error"
        );

        return;
    }


    if(
        currentGame.board[row][col]
    ){

        return;
    }


    try{

        const data =
            await apiRequest(
                "/move",
                {
                    method:"POST",
                    body:JSON.stringify({
                        gameId:
                            currentGame.gameId,
                        row,
                        col
                    })
                }
            );


        currentGame =
            data.game;

        renderGame();

        if(
            currentGame.status === "finished"
        ){

            stopGamePolling();

            await refreshProfile();
        }

    }catch(error){

        showToast(
            error.message,
            "error"
        );

        await refreshGame();
    }
}


/* =========================================================
   GAME POLLING
========================================================= */

function startGamePolling(){

    stopGamePolling();

    pollingTimer =
        setInterval(
            refreshGame,
            2200
        );
}


function stopGamePolling(){

    if(pollingTimer){

        clearInterval(
            pollingTimer
        );

        pollingTimer = null;
    }
}


async function refreshGame(){

    if(!currentGame){

        return;
    }


    if(
        currentGame.status ===
        "finished"
    ){

        stopGamePolling();

        return;
    }


    try{

        const data =
            await apiRequest(
                `/game/${encodeURIComponent(
                    currentGame.gameId
                )}`
            );


        currentGame =
            data.game;

        renderGame();

        if(
            currentGame.status ===
            "finished"
        ){

            stopGamePolling();

            await loadProfileSilently();
        }

    }catch(error){

        console.error(
            "Game refresh:",
            error
        );
    }
}


/* =========================================================
   ACTIVE GAME
========================================================= */

async function checkActiveGame(){

    try{

    }catch(error){

/* =========================================================
   RESIGN
========================================================= */

async function resignGame(){

    if(!currentGame){

        return;
    }


    if(
        currentGame.status !==
        "active"
    ){

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to resign?"
        );


    if(!confirmed){

        return;
    }


    try{

        const data =
            await apiRequest(
                "/game/resign",
                {
                    method:"POST",
                    body:JSON.stringify({
                        gameId:
                            currentGame.gameId
                    })
                }
            );


        currentGame =
            data.game;

        renderGame();

        stopGamePolling();

        await loadProfileSilently();

    }catch(error){

        showToast(
            error.message,
            "error"
        );
    }
}

        );

    try{

        showLoading(

            await apiRequest(

                    body:JSON.stringify({

                }
            );

            );

        }

    }catch(error){

        hideLoading();

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   ROOM POLLING
========================================================= */

let roomPollTimer = null;


function pollRoom(roomId){

    if(roomPollTimer){

        clearInterval(
            roomPollTimer
        );
    }


    roomPollTimer =
        setInterval(
            async ()=>{

                try{

                    const data =
                        await apiRequest(
                            `/room/${encodeURIComponent(
                                roomId
                            )}`
                        );


                    if(data.room?.gameId){

                        clearInterval(
                            roomPollTimer
                        );

                        const gameData =
                            await apiRequest(
                                `/game/${encodeURIComponent(
                                    data.room.gameId
                                )}`
                            );

                        openGame(
                            gameData.game
                        );
                    }

                }catch(error){

                    console.error(
                        "Room polling:",
                        error
                    );
                }

            },
            2500
        );
}

/* =========================================================
   MODAL
========================================================= */

function openModal(
    title,
    content
){

    $("modalTitle")
        .textContent = title;

    $("modalContent")
        .innerHTML = content;

    $("modal")
        .classList.remove("hidden");
}


function closeModal(){

    $("modal")
        .classList.add("hidden");
}


function modalBackgroundClick(event){

    if(
        event.target ===
        $("modal")
    ){

        closeModal();
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeJs(value){

    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}


/* =========================================================
   AUTO LOGIN / SESSION RESTORE
========================================================= */

async function restoreSession(){

    const token =
        localStorage.getItem(
            "oxToken"
        );


    if(!token){

        showAuthScreen();

        return;
    }


    try{

        showLoading(
            "Restoring session..."
        );

        const data =
            await apiRequest(
                "/auth/me"
            );


        currentPlayer =
            data.player;

        hideLoading();

        openDashboard();

    }catch(error){

        hideLoading();

        localStorage.removeItem(
            "oxToken"
        );

        showAuthScreen();
    }
}
