<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>OX Fighter Jets</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at top,#182a4d 0%,#08101f 45%,#04070d 100%);
    color:#fff;
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================================================
   HEADER
========================================================= */

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    background:rgba(5,10,20,.92);
    border-bottom:1px solid rgba(255,255,255,.1);
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#ff304f;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.player-badge{
    background:#101b31;
    border:1px solid #273958;
    padding:8px 14px;
    border-radius:30px;
    font-size:13px;
}

.logout-btn{
    background:#ff304f;
    color:white;
    border:0;
    padding:9px 15px;
    border-radius:9px;
    font-weight:700;
}

/* =========================================================
   MAIN
========================================================= */

.container{
    width:min(1200px,94%);
    margin:30px auto;
}

.card{
    background:rgba(13,23,41,.94);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.title{
    font-size:28px;
    font-weight:900;
    margin-bottom:8px;
}

.subtitle{
    color:#9eabc1;
    font-size:14px;
    margin-bottom:25px;
}

/* =========================================================
   AUTH
========================================================= */

.auth-wrapper{
    width:min(460px,94%);
    margin:70px auto;
}

.auth-tabs{
    display:flex;
    background:#080f1d;
    border-radius:12px;
    padding:4px;
    margin-bottom:22px;
}

.auth-tab{
    width:50%;
    padding:12px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#8e9ab0;
    font-weight:800;
}

.auth-tab.active{
    background:#1769ff;
    color:#fff;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    color:#b9c4d7;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input{
    width:100%;
    padding:13px 14px;
    background:#080f1d;
    border:1px solid #263653;
    color:#fff;
    border-radius:10px;
    outline:none;
}

.form-group input:focus{
    border-color:#1769ff;
}

.primary-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#1769ff;
    color:white;
    font-weight:900;
}

.primary-btn:hover{
    background:#3280ff;
}

.auth-message{
    margin-top:15px;
    font-size:13px;
    text-align:center;
    min-height:20px;
}

.success{
    color:#40e58b;
}

.error{
    color:#ff5b6e;
}

/* =========================================================
   DASHBOARD
========================================================= */

.dashboard-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
}

@media(max-width:850px){
    .dashboard-grid{
        grid-template-columns:1fr;
    }
}

.action-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

@media(max-width:500px){
    .action-grid{
        grid-template-columns:1fr;
    }
}

.action-btn{
    border:1px solid #293958;
    background:#0b1528;
    color:#fff;
    border-radius:12px;
    padding:15px;
    font-weight:800;
    transition:.2s;
}

.action-btn:hover{
    border-color:#1769ff;
    transform:translateY(-1px);
}

.action-btn.red{
    border-color:#612435;
}

.action-btn.green{
    border-color:#236242;
}

.action-btn.gold{
    border-color:#69571f;
}

/* =========================================================
   STATS
========================================================= */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

@media(max-width:650px){
    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

.stat{
    background:#080f1d;
    border:1px solid #202e48;
    border-radius:12px;
    padding:16px;
    text-align:center;
}

.stat-number{
    font-size:25px;
    font-weight:900;
}

.stat-label{
    color:#8d9bb2;
    font-size:12px;
    margin-top:5px;
}

/* =========================================================
   GAME
========================================================= */

.game-area{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.game-status{
    text-align:center;
    margin-bottom:20px;
}

.turn-text{
    font-size:19px;
    font-weight:900;
}

.game-result{
    margin-top:7px;
    color:#40e58b;
    font-weight:800;
}

.board{
    width:min(480px,90vw);
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:7px;
    padding:7px;
    background:#273958;
    border-radius:15px;
}

.cell{
    border:0;
    border-radius:9px;
    background:#0b1528;
    color:white;
    font-size:clamp(30px,8vw,58px);
    font-weight:1000;
    transition:.15s;
}

.cell:hover{
    background:#132441;
}

.cell.x{
    color:#ff405c;
}

.cell.o{
    color:#4d9aff;
}

.cell.win{
    background:#1f8b58;
    color:white;
}

.game-actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:20px;
}

.small-btn{
    border:0;
    padding:10px 16px;
    border-radius:9px;
    color:white;
    background:#1769ff;
    font-weight:800;
}

.small-btn.red{
    background:#d92f48;
}

.small-btn.dark{
    background:#24334d;
}

/* =========================================================
   PANELS
========================================================= */

.panel{
    margin-top:20px;
}

.panel h2{
    font-size:19px;
    margin-bottom:15px;
}

.input-row{
    display:flex;
    gap:10px;
}

.input-row input{
    flex:1;
    background:#080f1d;
    border:1px solid #293958;
    color:white;
    padding:12px;
    border-radius:9px;
    outline:none;
}

.input-row button{
    border:0;
    padding:0 17px;
    background:#1769ff;
    color:#fff;
    border-radius:9px;
    font-weight:800;
}

/* =========================================================
   LISTS
========================================================= */

.list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.list-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:#080f1d;
    border:1px solid #202e48;
    padding:13px;
    border-radius:11px;
}

.list-main{
    min-width:0;
}

.list-name{
    font-weight:900;
}

.list-meta{
    color:#8d9bb2;
    font-size:12px;
    margin-top:4px;
}

.rank{
    font-size:18px;
    font-weight:900;
    color:#ffd34d;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:500;
    padding:20px;
}

.modal-box{
    width:min(520px,100%);
    background:#0d1729;
    border:1px solid #293958;
    border-radius:18px;
    padding:22px;
    max-height:90vh;
    overflow:auto;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.close{
    border:0;
    background:#202e48;
    color:white;
    width:35px;
    height:35px;
    border-radius:50%;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;
    background:rgba(3,7,14,.78);
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.loader-box{
    text-align:center;
}

.spinner{
    width:45px;
    height:45px;
    border:4px solid #263653;
    border-top-color:#1769ff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto auto 15px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#101c31;
    border:1px solid #30415e;
    color:white;
    padding:14px 18px;
    border-radius:10px;
    z-index:2000;
    max-width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.toast.success{
    border-color:#236242;
}

.toast.error{
    border-color:#6b2938;
}
</style>
</head>

<body>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_BASE_URL =
    "https://oxfighterjets.onrender.com";

const API_PREFIX =
    `${API_BASE_URL}/api/ox`;


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentPlayer = null;
let currentGame = null;
let pollingTimer = null;
let matchmakingTimer = null;


/* =========================================================
   DOM HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   LOADING
========================================================= */

function showLoading(text="Please wait..."){

    $("loadingText").textContent = text;

    $("loading").classList.remove("hidden");
}


function hideLoading(){

    $("loading").classList.add("hidden");
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message,type="success"){

    const toast = $("toast");

    toast.textContent = message;

    toast.className =
        "toast " +
        (type === "error" ? "error" : "success");

    setTimeout(()=>{
        toast.classList.add("hidden");
    },3500);
}


/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(
    endpoint,
    options={}
){

    const token =
        localStorage.getItem("oxToken");

    const headers = {
        "Content-Type":"application/json",
        ...(options.headers || {})
    };

    if(token){
        headers["Authorization"] =
            `Bearer ${token}`;
    }

    try{

        const response =
            await fetch(
                `${API_PREFIX}${endpoint}`,
                {
                    ...options,
                    headers
                }
            );

        let data = {};

        try{
            data = await response.json();
        }catch{
            data = {};
        }

        if(response.status === 401){

            if(
                endpoint !== "/auth/login" &&
                endpoint !== "/auth/signup"
            ){

                localStorage.removeItem("oxToken");
                currentPlayer = null;

                showAuthScreen();

            }
        }

        if(!response.ok){

            throw new Error(
                data.message ||
                `Request failed (${response.status})`
            );
        }

        return data;

    }catch(error){

        console.error(
            "OX API Error:",
            endpoint,
            error
        );

        throw error;
    }
}


/* =========================================================
   AUTH TABS
========================================================= */

function showAuth(type){

    const login =
        type === "login";

    $("loginForm")
        .classList.toggle(
            "hidden",
            !login
        );

    $("signupForm")
        .classList.toggle(
            "hidden",
            login
        );

    $("loginTab")
        .classList.toggle(
            "active",
            login
        );

    $("signupTab")
        .classList.toggle(
            "active",
            !login
        );

    $("authMessage").textContent = "";
}


/* =========================================================
   AUTH SCREEN
========================================================= */

function showAuthScreen(){

    $("authScreen")
        .classList.remove("hidden");

    $("appScreen")
        .classList.add("hidden");

    $("mainHeader")
        .classList.add("hidden");

    $("gameCard")
        .classList.add("hidden");

    $("matchCard")
        .classList.add("hidden");

    stopGamePolling();
    stopMatchmakingPolling();
}


/* =========================================================
   APP SCREEN
========================================================= */

function showAppScreen(){

    $("authScreen")
        .classList.add("hidden");

    $("appScreen")
        .classList.remove("hidden");

    $("mainHeader")
        .classList.remove("hidden");
}


/* =========================================================
   SIGNUP
========================================================= */

async function signup(event){

    event.preventDefault();

    const name =
        $("signupName")
        .value
        .trim();

    const username =
        $("signupUsername")
        .value
        .trim()
        .toLowerCase();

    const password =
        $("signupPassword")
        .value;

    const confirmPassword =
        $("signupConfirmPassword")
        .value;


    if(!name){

        setAuthMessage(
            "Please enter your name.",
            true
        );

        return;
    }


    if(!username){

        setAuthMessage(
            "Please enter a username.",
            true
        );

        return;
    }


    if(!/^[a-zA-Z0-9_-]{3,30}$/.test(username)){

        setAuthMessage(
            "Username must be 3-30 characters and use only letters, numbers, _ or -.",
            true
        );

        return;
    }


    if(password.length < 6){

        setAuthMessage(
            "Password must be at least 6 characters.",
            true
        );

        return;
    }


    if(password !== confirmPassword){

        setAuthMessage(
            "Passwords do not match.",
            true
        );

        return;
    }


    try{

        showLoading(
            "Creating your account..."
        );

        const data =
            await apiRequest(
                "/auth/signup",
                {
                    method:"POST",
                    body:JSON.stringify({
                        name,
                        username,
                        password
                    })
                }
            );


        localStorage.setItem(
            "oxToken",
            data.token
        );


        currentPlayer =
            data.player;


        hideLoading();

        showToast(
            "Account created successfully!"
        );


        openDashboard();

    }catch(error){

        hideLoading();

        setAuthMessage(
            error.message,
            true
        );
    }
}

        .classList.remove("hidden");

    window.scrollTo({
        top:$("gameCard").offsetTop - 80,
        behavior:"smooth"
    });
}


/* =========================================================
   RENDER GAME
========================================================= */

function renderGame(){

    if(!currentGame){

        return;
    }


    const board =
        $("board");

    board.innerHTML = "";


    const myPlayer =
        currentGame.players
        .find(
            p =>
            p.playerId ===
            currentPlayer.playerId
        );


    for(let r=0;r<5;r++){

        for(let c=0;c<5;c++){

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "cell";


            const value =
                currentGame.board[r][c];


            if(value){

                button.textContent =
                    value;

                button.classList.add(
                    value.toLowerCase()
                );
            }


            if(
                currentGame.winningLine &&
                currentGame.winningLine.some(
                    cell =>
                    cell[0] === r &&
                    cell[1] === c
                )
            ){

                button.classList.add(
                    "win"
                );
            }


            button.onclick =
                () => makeMove(r,c);


            if(
                currentGame.status !== "active" ||
                currentGame.currentTurn !==
                currentPlayer.playerId ||
                value
            ){

                button.disabled = true;
            }


            board.appendChild(
                button
            );
        }
    }


    const turnPlayer =
        currentGame.players
        .find(
            p =>
            p.playerId ===
            currentGame.currentTurn
        );


    if(
        currentGame.status === "active"
    ){

        if(
            currentGame.currentTurn ===
            currentPlayer.playerId
        ){

            $("turnText").textContent =
                `Your turn (${myPlayer?.symbol || ""})`;

        }else{

            $("turnText").textContent =
                `${turnPlayer?.name || "Opponent"}'s turn`;
        }

        $("gameResult").textContent = "";

    }else{

        showGameResult();
    }


    $("rematchBtn")
        .classList.toggle(
            "hidden",
            currentGame.status !== "finished"
        );
}


/* =========================================================
   GAME RESULT
========================================================= */

function showGameResult(){

    if(
        currentGame.result === "draw"
    ){

        $("turnText").textContent =
            "DRAW";

        $("gameResult").textContent =
            "Board is full.";

        return;
    }


    const winner =
        currentGame.players
        .find(
            p =>
            p.playerId ===
            currentGame.winner
        );


    if(
        currentGame.winner ===
        currentPlayer.playerId
    ){

        $("turnText").textContent =
            "🎉 YOU WON!";

        $("gameResult").textContent =
            "Congratulations!";

    }else{

        $("turnText").textContent =
            "GAME OVER";

        $("gameResult").textContent =
            `${winner?.name || "Opponent"} won.`;
    }
}


/* =========================================================
   MAKE MOVE
========================================================= */

async function makeMove(row,col){

    if(!currentGame){

        return;
    }


    if(
        currentGame.status !== "active"
    ){

        return;
    }


    if(
        currentGame.currentTurn !==
        currentPlayer.playerId
    ){

        showToast(
            "It is not your turn.",
            "error"
        );

        return;
    }


    if(
        currentGame.board[row][col]
    ){

        return;
    }


    try{

        const data =
            await apiRequest(
                "/move",
                {
                    method:"POST",
                    body:JSON.stringify({
                        gameId:
                            currentGame.gameId,
                        row,
                        col
                    })
                }
            );


        currentGame =
            data.game;

        renderGame();

        if(
            currentGame.status === "finished"
        ){

            stopGamePolling();

            await refreshProfile();
        }

    }catch(error){

        showToast(
            error.message,
            "error"
        );

        await refreshGame();
    }
}


/* =========================================================
   GAME POLLING
========================================================= */

function startGamePolling(){

    stopGamePolling();

    pollingTimer =
        setInterval(
            refreshGame,
            2200
        );
}


function stopGamePolling(){

    if(pollingTimer){

        clearInterval(
            pollingTimer
        );

        pollingTimer = null;
    }
}


async function refreshGame(){

    if(!currentGame){

        return;
    }


    if(
        currentGame.status ===
        "finished"
    ){

        stopGamePolling();

        return;
    }


    try{

        const data =
            await apiRequest(
                `/game/${encodeURIComponent(
                    currentGame.gameId
                )}`
            );


        currentGame =
            data.game;

        renderGame();

        if(
            currentGame.status ===
            "finished"
        ){

            stopGamePolling();

            await loadProfileSilently();
        }

    }catch(error){

        console.error(
            "Game refresh:",
            error
        );
    }
}

========================================================= */

async function resignGame(){

    if(!currentGame){

        return;
    }


    if(
        currentGame.status !==
        "active"
    ){

        return;
    }


    const confirmed =
        confirm(
            "Are you sure you want to resign?"
        );


    if(!confirmed){

        return;
    }


    try{

        const data =
            await apiRequest(
                "/game/resign",

                    method:"POST",
                    body:JSON.stringify({
                        gameId:

                    })

        currentGame =
            data.game;

        renderGame();

        stopGamePolling();

        await loadProfileSilently();

}

/* =========================================================
   ROOM POLLING
========================================================= */

let roomPollTimer = null;


function pollRoom(roomId){

    if(roomPollTimer){

        clearInterval(
            roomPollTimer
        );
    }


    roomPollTimer =
        setInterval(
            async ()=>{

                try{

                    const data =
                        await apiRequest(
                            `/room/${encodeURIComponent(
                                roomId
                            )}`
                        );


                    if(data.room?.gameId){

                        clearInterval(
                            roomPollTimer
                        );

                        const gameData =
                            await apiRequest(
                                `/game/${encodeURIComponent(
                                    data.room.gameId
                                )}`
                            );

                        openGame(
                            gameData.game
                        );
                    }

                }catch(error){

                    console.error(
                        "Room polling:",
                        error
                    );
                }

            },
            2500
        );
}

                <div class="list-item">

                    <div class="list-main">

                        <div class="list-name">
                            ${escapeHtml(
                                senderName
                            )}
                        </div>

                        <div class="list-meta">
                            wants to play with you
                        </div>

                    </div>

                    <div
                        style="
                        display:flex;
                        gap:6px
                        "
                    >

                        <button
                            class="small-btn"
                            onclick="
                                acceptRequest(
                                    '${escapeJs(
                                        req.requestId
                                    )}'
                                )
                            "
                        >
                            Accept
                        </button>

                        <button
                            class="small-btn red"
                            onclick="
                                rejectRequest(
                                    '${escapeJs(
                                        req.requestId
                                    )}'
                                )
                            "
                        >
                            Reject
                        </button>

                    </div>

                </div>

                `;
            }
        }


        html += `
            </div>
        `;


        openModal(
            "✉ Requests",
            html
        );

    }catch(error){

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   ACCEPT REQUEST
========================================================= */

async function acceptRequest(requestId){

    try{

        const data =
            await apiRequest(
                "/request/accept",
                {
                    method:"POST",
                    body:JSON.stringify({
                        requestId
                    })
                }
            );


        closeModal();

        openGame(
            data.game
        );

    }catch(error){

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   REJECT REQUEST
========================================================= */

async function rejectRequest(requestId){

    try{

        await apiRequest(
            "/request/reject",
            {
                method:"POST",
                body:JSON.stringify({
                    requestId
                })
            }
        );


        showToast(
            "Request rejected."
        );


        loadRequests();

    }catch(error){

        showToast(
            error.message,
            "error"
        );
    }
}


/* =========================================================
   MODAL
========================================================= */

function openModal(
    title,
    content
){

    $("modalTitle")
        .textContent = title;

    $("modalContent")
        .innerHTML = content;

    $("modal")
        .classList.remove("hidden");
}


function closeModal(){

    $("modal")
        .classList.add("hidden");
}


function modalBackgroundClick(event){

    if(
        event.target ===
        $("modal")
    ){

        closeModal();
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function escapeJs(value){

    return String(value ?? "")
        .replaceAll("\\","\\\\")
        .replaceAll("'","\\'");
}


/* =========================================================
   AUTO LOGIN / SESSION RESTORE
========================================================= */

async function restoreSession(){

    const token =
        localStorage.getItem(
            "oxToken"
        );


    if(!token){

        showAuthScreen();

        return;
    }


    try{

        showLoading(
            "Restoring session..."
        );

        const data =
            await apiRequest(
                "/auth/me"
            );


        currentPlayer =
            data.player;

        hideLoading();

        openDashboard();

    }catch(error){

        hideLoading();

        localStorage.removeItem(
            "oxToken"
        );

        showAuthScreen();
    }
}


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeModal();
        }
    }
);


/* =========================================================
   PAGE START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        restoreSession();

    }
);

</script>
